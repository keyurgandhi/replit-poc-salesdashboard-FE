name: Azure App Service CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      # FIX 1: Write specifically to .env.production so Vite reads it during production builds
      - name: Generate Production Environment File
        run: |
          echo "VITE_BACKEND_URL=https://replitpocbe-haf2chhgg3hhegck.canadacentral-01.azurewebsites.net/api" > .env.production

      # FIX 2: Restored standard build command (removed --force)
      - name: Build frontend
        run: npm run build

      - name: Verify Environment Variable Injection
        run: grep -r "replitpocbe" ./dist/assets/ || echo "URL NOT FOUND IN BUNDLE"

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          package: ./dist
